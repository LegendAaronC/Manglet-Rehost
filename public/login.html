<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manglet Rehost | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&family=DynaPuff:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script>
if (localStorage.getItem('mangletSessionToken')) {
    window.location.href = 'dashboard';
}
</script>

<style>
*, *::before, *::after { box-sizing: border-box; }
html { margin: 0 !important; padding: 0 !important; width: 100%; min-height: 100%; }
body { margin: 0 !important; padding: 0 !important; width: 100%; min-width: 0; }
html, body { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; }

:root {
    --bg: #130600;
    --bg-deep: rgba(8, 2, 0, 0.88);
    --surface: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 202, 40, 0.18);
    --gold: #ffca28;
    --text: #fff3dc;
    --text-muted: rgba(255, 243, 220, 0.62);
    --btn-primary-top: #FFE44D;
    --btn-primary-bot: #FF9500;
    --btn-secondary-top: #FFC928;
    --btn-secondary-bot: #FF7A18;
    --btn-text: #2d0800;
    --radius-card: 16px;
    --radius-btn: 10px;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    color: var(--text);
    background: var(--bg);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}
body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 900;
    pointer-events: none;
    opacity: .055;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='250' height='250' filter='url(%23n)'/></svg>");
    background-size: 250px 250px;
}
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(ellipse 80% 50% at 20% -5%, #c45200 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 105%, #6b2200 0%, transparent 50%),
        var(--bg);
}
.navbar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 200;
}
.logo-link { text-decoration: none; display: inline-block; }
.logo {
    font-family: 'DynaPuff', cursive;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text);
}
.btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: .875rem;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    padding: 11px 20px;
    border-radius: var(--radius-btn);
    letter-spacing: .1px;
    text-align: center;
    transition: opacity .12s, transform .1s, filter .12s;
    box-shadow: 0 2px 0 rgba(122, 58, 0, .65);
}
.btn:hover { opacity: .9; transform: translateY(-1px); filter: brightness(1.04); }
.btn:active { opacity: .78; transform: translateY(0); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.primary {
    background: linear-gradient(180deg, var(--btn-primary-top) 0%, var(--btn-primary-bot) 100%);
    color: var(--btn-text);
}
.secondary {
    background: linear-gradient(180deg, var(--btn-secondary-top) 0%, var(--btn-secondary-bot) 100%);
    color: var(--btn-text);
    border: 1px solid rgba(255, 202, 40, .25);
}
.auth-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 48px 20px;
    position: relative;
    z-index: 5;
}
.auth-card {
    max-width: 480px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 32px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 18px 55px rgba(0, 0, 0, .25);
    text-align: center;
}
.auth-card h2 {
    font-family: 'DynaPuff', cursive;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.35rem);
    line-height: 1.15;
    margin-bottom: 10px;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .2);
}
.auth-card > p {
    color: var(--text-muted);
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 26px;
}
.form-group { margin-bottom: 18px; text-align: left; }
.form-group label {
    display: block;
    font-weight: 700;
    font-size: .9rem;
    margin-bottom: 8px;
    color: var(--text);
    letter-spacing: .1px;
}
.input-wrapper { position: relative; display: flex; align-items: center; }
.input-wrapper .material-icons {
    position: absolute;
    left: 14px;
    font-size: 1.25rem;
    color: rgba(255, 202, 40, .7);
    pointer-events: none;
}
.form-input, .form-textarea {
    width: 100%;
    border-radius: 10px;
    border: 1px solid rgba(255, 202, 40, .2);
    background: rgba(8, 2, 0, .42);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: .95rem;
    outline: none;
    transition: background .2s, border-color .2s, box-shadow .2s;
}
.form-input { padding: 13px 14px 13px 44px; }
.form-input.no-icon { padding: 13px 14px; }
.form-textarea { padding: 14px; resize: none; min-height: 80px; }
.form-input:focus, .form-textarea:focus {
    background: rgba(8, 2, 0, .65);
    border-color: #ffca28;
    box-shadow: 0 0 0 3px rgba(255, 202, 40, .12);
}
.form-input::placeholder, .form-textarea::placeholder { color: rgba(255, 243, 220, .35); }
.message-card {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: .9rem;
    margin: 14px 0 16px;
    text-align: left;
    overflow-wrap: anywhere;
}
.message-card .material-icons { font-size: 1.2rem; flex-shrink: 0; }
.submit-btn { width: 100%; margin: 5px 0 20px; }
.switch-auth { font-size: .9rem; font-weight: 600; color: var(--text-muted); }
.switch-auth a {
    color: #ffca28;
    text-decoration: none;
    font-weight: 800;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
}
.switch-auth a:hover { border-color: #ffca28; }
footer {
    margin-top: auto;
    padding: 20px 30px;
    text-align: center;
    background: var(--bg-deep);
    border-top: 1px solid var(--border);
    font-size: .82rem;
    font-weight: 700;
    color: var(--text-muted);
    position: relative;
    z-index: 5;
    backdrop-filter: blur(14px);
}
.strength-meter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 8px 0 6px;
}
.strength-bar {
    height: 6px;
    width: 100%;
    background: rgba(255, 243, 220, .12);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
}
.strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    transition: width .3s ease, background-color .3s ease;
}
.strength-text {
    font-size: .8rem;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
}
.checkbox-group {
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
    margin: 20px 0 10px;
    text-align: left;
}
.checkbox-group input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.custom-checkbox {
    height: 22px;
    width: 22px;
    background: rgba(8, 2, 0, .42);
    border: 1px solid rgba(255, 202, 40, .3);
    border-radius: 6px;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, border-color .15s, transform .15s;
}
.custom-checkbox .material-icons {
    font-size: 1rem;
    color: #2d0800;
    opacity: 0;
    transform: scale(.6);
    transition: opacity .15s ease, transform .15s ease;
}
.checkbox-group:hover .custom-checkbox { border-color: #ffca28; }
.checkbox-group input:checked ~ .custom-checkbox { background: #ffca28; border-color: #ffca28; }
.checkbox-group input:checked ~ .custom-checkbox .material-icons { opacity: 1; transform: scale(1); }
.checkbox-group input:focus-visible ~ .custom-checkbox { outline: 2px solid #ffca28; outline-offset: 3px; }
.checkbox-label { font-weight: 700; font-size: .9rem; color: var(--text-muted); }
@media (max-width: 700px) {
    .navbar { min-height: 60px; justify-content: center; padding: 12px 16px; }
    .logo { font-size: 1.5rem; }
    .auth-container { padding: 32px 16px; }
    .auth-card { padding: 26px 20px; }
    footer { padding: 18px 16px; }
}

</style>
</head>

<body>

<div class="bg-base-gradient"></div>

<nav class="navbar">
    <a href="/" class="logo-link"><div class="logo">Manglet Rehost</div></a>
</nav>

<main class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>
        <p>Sign in to your account below</p>
        
        <form id="login-form" action="#" method="POST" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="material-icons">person</span>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="material-icons">lock</span>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>

            <div id="message-card-box" class="message-card">
                <span id="card-icon" class="material-icons">error</span>
                <span id="card-text"></span>
            </div>

            <button type="submit" id="submit-btn" class="btn primary submit-btn"><span>Login</span></button>
        </form>

        <div class="switch-auth">
            Don't have an account? <a href="register">Register</a>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');

    const messageCardBox = document.getElementById('message-card-box');
    const cardIcon = document.getElementById('card-icon');
    const cardText = document.getElementById('card-text');

    function showCard(text, isError) {
        cardText.textContent = text;
        messageCardBox.style.display = "flex";

        if (isError) {
            messageCardBox.style.backgroundColor = "rgba(255, 77, 77, 0.25)";
            messageCardBox.style.border = "2px solid #ff4d4d";
            cardIcon.textContent = "error";
            cardIcon.style.color = "#ff4d4d";
            cardText.style.color = "#ff9999";
        } else {
            messageCardBox.style.backgroundColor = "rgba(46, 204, 113, 0.25)";
            messageCardBox.style.border = "2px solid #2ecc71";
            cardIcon.textContent = "check_circle";
            cardIcon.style.color = "#2ecc71";
            cardText.style.color = "#a3e4d7";
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const cleanUsername = usernameInput.value.trim();
        const rawPassword = passwordInput.value;

        if (!cleanUsername) {
            showCard("Username required", true);
            return;
        }
        if (!rawPassword) {
            showCard("Password required", true);
            return;
        }

        showCard("Logging in...", false);
        submitBtn.disabled = true;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: cleanUsername, password: rawPassword })
            });
            const data = await response.json();

            if (!response.ok) {
                submitBtn.disabled = false;
                showCard(data.message || "Login failed.", true);
                return;
            }

            localStorage.setItem('mangletSessionToken', data.token);
            window.location.href = "dashboard";
        } catch (error) {
            submitBtn.disabled = false;
            showCard("send this to support", true);
        }
    });
</script>
</body>
</html>
