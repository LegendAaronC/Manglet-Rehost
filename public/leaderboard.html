<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=DynaPuff&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DynaPuff', Arial, sans-serif; }
:root {
  --bg-color: #ffe600;
  --sidebar-color: #ffee00;
  --sidebar-hover: #ffd000;
  --token-accent: #ffc400;
}
body { background-color: var(--bg-color); min-height: 100vh; display: flex; }

.sidebar { width: 250px; background: var(--sidebar-color); min-height: 100vh; display: flex; flex-direction: column; padding: 20px 0; position: fixed; top: 0; left: 0; z-index: 10; }
.sidebar-logo { font-size: 28px; font-weight: 900; color: white; padding: 0 20px 24px 20px; letter-spacing: 2px; }
.sidebar-nav { display: flex; flex-direction: column; flex: 1; }
.sidebar-nav a { color: #ffffff; text-decoration: none; padding: 12px 20px; font-size: 16px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
.sidebar-nav a:hover, .sidebar-nav a.active { background: var(--sidebar-hover); color: white; }

.topbar { position: fixed; top: 0; left: 250px; right: 0; padding: 20px 24px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; z-index: 10; }
.token-display { display: flex; align-items: center; gap: 6px; background: var(--token-accent); color: white; padding: 6px 14px; border-radius: 8px; font-size: 16px; }
.token-display img { width: 22px; height: 22px; border-radius: 4px; }
.ruby-display { display: flex; align-items: center; gap: 6px; background: #e0115f; color: white; padding: 6px 14px; border-radius: 8px; font-size: 16px; }
.ruby-display img { width: 22px; height: 22px; border-radius: 4px; }

.main-content { margin-left: 250px; flex: 1; display: flex; justify-content: center; padding: 100px 20px 60px 20px; }
.lb-wrap { width: 100%; max-width: 700px; font-family: Arial, sans-serif; }

.lb-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; gap: 16px; }
.lb-title { font-family: 'DynaPuff', Arial, sans-serif; font-size: 30px; color: #17162b; }
.lb-subtitle { color: #6b6320; font-size: 13.5px; margin-top: 4px; }

.lb-toggle-group { display: flex; gap: 4px; background: #14121f; border-radius: 12px; padding: 4px; }
.lb-toggle-btn {
  border: none; background: transparent; color: #7d829c; font-family: 'DynaPuff', Arial, sans-serif;
  font-size: 12.5px; padding: 10px 16px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: background 0.15s, color 0.15s;
}
.lb-toggle-btn.active { background: #7c5cff; color: #fff; }
.lb-toggle-btn:hover:not(.active) { color: #cfd0e0; }

.lb-list { display: flex; flex-direction: column; gap: 10px; }
.lb-row {
  display: flex; align-items: center; gap: 16px; background: #14121f; border: 1px solid #22202f;
  border-radius: 14px; padding: 14px 18px;
}
.lb-row.rank-1 { border-color: rgba(255,215,0,0.55); background: linear-gradient(90deg, rgba(255,215,0,0.08), #14121f 40%); }
.lb-row.rank-3 { border-color: rgba(255,140,60,0.5); background: linear-gradient(90deg, rgba(255,140,60,0.08), #14121f 40%); }

.lb-rank { font-family: 'DynaPuff', Arial, sans-serif; font-size: 20px; color: #7d829c; width: 44px; flex-shrink: 0; }
.lb-rank.rank-1 { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.5); }
.lb-rank.rank-2 { color: #d8d8e0; }
.lb-rank.rank-3 { color: #ff8c3c; text-shadow: 0 0 10px rgba(255,140,60,0.4); }

.lb-avatar {
  width: 46px; height: 46px; border-radius: 12px; background: #23233d; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lb-avatar-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #ff9f43, #ff5e00); color: #fff; font-size: 18px; font-family: 'DynaPuff', Arial, sans-serif;
}

.lb-identity { flex: 1; min-width: 0; }
.lb-name-row { display: flex; align-items: center; gap: 6px; }
.lb-name { font-weight: bold; font-size: 15px; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-name.rank-owner { color: #ffcf4d; }
.lb-name.rank-admin { color: #6ea0ff; }
.lb-badge-icon { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; }
.lb-rank-tag { color: #7d829c; font-size: 11.5px; margin-top: 2px; }

.lb-stats { text-align: right; flex-shrink: 0; }
.lb-primary-value { font-family: 'DynaPuff', Arial, sans-serif; font-size: 17px; color: #fff; }
.lb-primary-label { color: #7d829c; font-size: 10.5px; margin-left: 4px; font-family: Arial, sans-serif; }
.lb-secondary-value { color: #ffcf4d; font-size: 12px; font-weight: bold; margin-top: 3px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

.lb-empty-note { color: #6b6320; text-align: center; padding: 40px 0; font-size: 14px; }
.lb-loading-note { color: #6b6320; text-align: center; padding: 40px 0; font-size: 14px; }

@media (max-width: 560px) {
  .lb-row { padding: 12px; gap: 10px; }
  .lb-avatar { width: 38px; height: 38px; }
}
</style>

<body>

<a href="bazaar"><span class="material-icons">store</span>Bazaar</a>

<a href="rubyshop"><span class="material-icons">diamond</span>Ruby Shop</a>

<div class="main-content">
<div class="lb-wrap">

  <div class="lb-header-row">
    <div>
      <div class="lb-title">Leaderboard</div>
      <div class="lb-subtitle" id="lbSubtitle">Top players by coins.</div>
    </div>
    <div class="lb-toggle-group">
      <button class="lb-toggle-btn active" id="coinsTabBtn" onclick="switchLeaderboardTab('coins')">🏆 Coins</button>
      <button class="lb-toggle-btn" id="packsTabBtn" onclick="switchLeaderboardTab('packs')">📦 Packs Opened</button>
    </div>
  </div>

  <div class="lb-list" id="lbList">
    <div class="lb-loading-note">Loading...</div>
  </div>

</div>
</div>

<script>
const AUTH_TOKEN = localStorage.getItem('mangletSessionToken');
if (!AUTH_TOKEN) { location.href = "/login"; }

async function apiFetch(url, options = {}) {
  const opts = Object.assign({}, options);
  opts.headers = Object.assign(
    { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    options.headers || {}
  );
  const res = await fetch(url, opts);
  if (res.status === 401) {
    localStorage.removeItem('mangletSessionToken');
    location.href = "/login";
    throw new Error('Not logged in');
  }
  return res;
}
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

let currentTab = 'coins';

function rankLabel(row) {
  if (row.isOwner) return { label: 'Owner', cls: 'rank-owner' };
  if (row.isAdmin) return { label: 'Admin', cls: 'rank-admin' };
  return { label: 'Common', cls: '' };
}

function avatarHtml(row) {
  const initial = escapeHtml(row.username.charAt(0).toUpperCase());
  if (row.avatar) {
    return `<img src="${escapeHtml(row.avatar)}" alt="" onerror="this.parentElement.innerHTML='<div class=lb-avatar-fallback>${initial}</div>';">`;
  }
  return `<div class="lb-avatar-fallback">${initial}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

async function loadLeaderboard() {
  const res = await apiFetch('/api/leaderboard?sort=' + currentTab);
  const data = await res.json();
  const list = document.getElementById('lbList');

  if (data.rows.length === 0) {
    list.innerHTML = '<div class="lb-empty-note">No players yet.</div>';
    return;
  }

  list.innerHTML = data.rows.map((row, i) => {
    const place = i + 1;
    const rowRankClass = place === 1 ? 'rank-1' : (place === 3 ? 'rank-3' : '');
    const rankNumClass = place === 1 ? 'rank-1' : (place === 2 ? 'rank-2' : (place === 3 ? 'rank-3' : ''));
    const rank = rankLabel(row);

    const badgeHtml = row.badge
      ? `<img class="lb-badge-icon" src="${escapeHtml(row.badge.image)}" alt="" title="${escapeHtml(row.badge.label)}" onerror="this.outerHTML='${escapeHtml(row.badge.icon)}';">`
      : '';

    const primaryValue = currentTab === 'coins' ? fmt(row.tokens) : fmt(row.packsOpened);
    const primaryLabel = currentTab === 'coins' ? 'Coins' : 'Packs';
    const secondaryValue = currentTab === 'coins' ? fmt(row.packsOpened) + ' packs' : fmt(row.tokens) + ' coins';

    return `
      <div class="lb-row ${rowRankClass}">
        <div class="lb-rank ${rankNumClass}">#${place}</div>
        <div class="lb-avatar">${avatarHtml(row)}</div>
        <div class="lb-identity">
          <div class="lb-name-row">
            <span class="lb-name ${rank.cls}">${escapeHtml(row.username)}</span>
            ${badgeHtml}
          </div>
          <div class="lb-rank-tag">${rank.label}</div>
        </div>
        <div class="lb-stats">
          <span><span class="lb-primary-value">${primaryValue}</span><span class="lb-primary-label">${primaryLabel}</span></span>
          <div class="lb-secondary-value">🪙 ${secondaryValue}</div>
        </div>
      </div>
    `;
  }).join('');
}

function switchLeaderboardTab(tab) {
  currentTab = tab;
  document.getElementById('coinsTabBtn').classList.toggle('active', tab === 'coins');
  document.getElementById('packsTabBtn').classList.toggle('active', tab === 'packs');
  document.getElementById('lbSubtitle').innerText = tab === 'coins' ? 'Top players by coins.' : 'Top players by packs opened.';
  loadLeaderboard();
}

const socket = io({ auth: { token: AUTH_TOKEN } });
socket.on('rubyEarned', (data) => {
  const el = document.getElementById('rubyBalance');
  if (el) el.innerText = fmt(data.rubies);
});

async function loadMe() {
  const res = await apiFetch('/api/me');
  const data = await res.json();
  document.getElementById('tokenBalance').innerText = fmt(data.user.tokens);
  const rubyEl = document.getElementById('rubyBalance');
  if (rubyEl) rubyEl.innerText = fmt(data.user.rubies || 0);
  applyMangletTheme(data.user.theme);
  showOwnerNav(data.user.isOwner);
  socket.emit('registerUser', data.user.username);
  await loadLeaderboard();
}
loadMe();
</script>


<script id="manglet-rehost-nav-icons">
(() => {
  const iconMap = {
    'Market':'storefront','Shop':'shopping-bag','Global Chat':'forum','Collection':'inventory_2',
    'Clans':'groups','News':'newspaper','Trade':'swap_horiz','Bazaar':'store',
    'Battle Royale':'sports_esports','Leaderboard':'leaderboard','Ruby Shop':'diamond',
    'Credits':'favorite','Settings':'settings','Profile':'person','Admin Panel':'admin_panel_settings',
    'Owner Panel':'verified_user'
  };
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    const label = a.textContent.trim();
    const icon = iconMap[label];
    if (icon && !a.querySelector('.manglet-nav-icon')) {
      const span = document.createElement('span');
      span.className = 'material-icons manglet-nav-icon';
      span.setAttribute('aria-hidden','true');
      span.textContent = icon;
      span.style.fontSize = '19px';
      span.style.lineHeight = '1';
      a.prepend(span);
    }
  });
})();
</script>
