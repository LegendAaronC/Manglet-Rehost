    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'DynaPuff', Arial, sans-serif; 
        }
        :root {
            --bg-color: #ffe600;
            --sidebar-color: #ffee00;
            --sidebar-hover: #ffd000;
            --token-accent: #ffc400;
        }
        body { 
            background-color: var(--bg-color); 
            min-height: 100vh; 
            display: flex; 
        }
.sidebar { width: 250px; background: var(--sidebar-color); min-height: 100vh; display: flex; flex-direction: column; padding: 20px 0; position: fixed; top: 0; left: 0; z-index: 10; }
.sidebar-logo { font-size: 28px; font-weight: 900; color: white; padding: 0 20px 24px 20px; letter-spacing: 2px; }
.sidebar-nav { display: flex; flex-direction: column; flex: 1; }
.sidebar-nav a { color: #ffffff; text-decoration: none; padding: 12px 20px; font-size: 16px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
.sidebar-nav a:hover, .sidebar-nav a.active { background: var(--sidebar-hover); color: white; }
.topbar{position:fixed!important;top:0!important;left:250px!important;right:0!important;display:flex!important;justify-content:flex-end!important;align-items:center!important;padding:18px 24px!important;z-index:15!important;pointer-events:none}
.token-display { display: flex; align-items: center; gap: 6px; background: var(--token-accent); color: white; padding: 6px 14px; border-radius: 8px; font-size: 16px; font-family: 'DynaPuff'; }
.token-display img { width: 22px; height: 22px; border-radius: 4px; font-family: 'DynaPuff'; }
.ruby-display { display: flex; align-items: center; gap: 6px; background: #e0115f; color: white; padding: 6px 14px; border-radius: 8px; font-size: 16px; font-family: 'DynaPuff'; }
.ruby-display img { width: 22px; height: 22px; border-radius: 4px; font-family: 'DynaPuff'; }
        .main-content { 
            margin-left: 250px; 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px; 
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            background: #14121f;
            border: 1px solid #22202f;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .chat-header {
            background: #1a1730;
            padding: 16px 24px;
            font-size: 18px;
            border-bottom: 1px solid #22202f;
            color: #e8e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #26da72; 
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(38,218,114,0.6);
        }
        .user-count {
            color: #9096b3;
            font-size: 14px;
            margin-left: 4px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        
        .customize-trigger {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #cfd0e0;
            transition: background 0.15s;
        }
        .customize-trigger:hover { background: rgba(255,255,255,0.09); }
        .customize-trigger:active { transform: translateY(1px); }
        .customize-trigger.locked { color: #7a6a00; background: rgba(255,207,77,0.08); }
        .swatch-preview {
            width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,0.25); flex-shrink: 0;
        }

        
        .customize-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 260px;
            background: #17162b;
            border: 3px solid #363259;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            z-index: 50;
            display: none;
            font-family: 'Arial', sans-serif;
        }
        .customize-panel.open { display: block; }
        .customize-panel h4 {
            color: #f7b922;
            font-family: 'DynaPuff', Arial, sans-serif;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .customize-panel .locked-msg {
            color: #cfc8ea;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .customize-panel .locked-msg a {
            color: #f7b922;
            font-weight: bold;
        }
        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .swatch {
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; border: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.1s, border-color 0.1s;
        }
        .swatch:hover { transform: scale(1.1); }
        .swatch.active { border-color: #fff; transform: scale(1.12); }
        .custom-color-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
        }
        .custom-color-row input[type="color"] {
            width: 34px; height: 34px; border: none; border-radius: 6px; background: none; cursor: pointer; padding: 0;
        }
        .custom-color-row label {
            color: #cfc8ea; font-size: 13px;
        }
        .glow-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            color: #e2e1f0; font-size: 13px; margin-bottom: 16px;
        }
        .toggle-switch {
            width: 40px; height: 22px; background: #363259; border-radius: 11px;
            position: relative; cursor: pointer; transition: background 0.2s;
        }
        .toggle-switch.on { background: #e8b923; }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; border-radius: 50%; background: #fff;
            transition: left 0.2s;
        }
        .toggle-switch.on::after { left: 20px; }
        .live-preview {
            background: #0d0c1a; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
            font-size: 14px; font-weight: bold;
        }
        .panel-save {
            width: 100%; background: #e8b923; color: #17162b; border: none;
            border-radius: 10px; padding: 10px; font-family: 'DynaPuff', Arial, sans-serif;
            font-size: 13px; cursor: pointer; box-shadow: 0 4px 0 #a67c13;
        }
        .panel-save:active { transform: translateY(2px); box-shadow: 0 2px 0 #a67c13; }

        .chat-messages { 
            flex: 1; 
            padding: 24px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            background: #0d0c1a;
        }
        .message-row { 
            display: flex; 
            gap: 12px; 
            align-items: flex-start; 
        }
        .avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.12);
            background: #3a2e5c; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 14px; 
            color: white; 
            flex-shrink: 0; 
            font-family: 'Arial', sans-serif;
        }
        .message-content { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            font-family: 'Arial', sans-serif;
        }
        .message-meta { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 14px; 
            font-weight: bold; 
        }
        .username { 
            color: #e8e8f0; 
        }
        .username.glow {
            animation: glowPulse 2.2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.35); }
        }
        .tag { 
            font-size: 11px; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-weight: 800; 
            text-transform: uppercase; 
            border: 1.5px solid #000;
        }
        .tag.piggie { color: #000; background: #ffeb3b; }
        .tag.cloaket { color: #fff; background: #00b0ff; }
        .tag.haribo { color: #fff; background: #ff4081; }

        .clan-tag-chip {
            font-size: 12.5px;
            font-weight: 800;
        }
        .badge-chip {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 800;
            background: rgba(255,255,255,0.07);
            color: #cfd0e0;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-chip-img {
            width: 13px;
            height: 13px;
            object-fit: contain;
        }
        
        .message-text { 
            color: #cfd0e0; 
            font-size: 14px; 
            line-height: 1.4; 
            word-break: break-word; 
        }
        .mention { 
            color: #9d4edd; 
            font-weight: bold; 
        }
        .chat-footer { 
            padding: 18px 24px; 
            background: #14121f; 
            border-top: 1px solid #22202f;
        }
        .chat-form { 
            display: flex; 
            background: rgba(255,255,255,0.04); 
            border: 1px solid rgba(255,255,255,0.09); 
            border-radius: 10px; 
            padding: 6px 12px; 
            align-items: center; 
            gap: 12px; 
        }
        .chat-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            outline: none; 
            color: #e8e8f0; 
            font-size: 15px; 
            padding: 10px 0; 
            font-family: 'Arial', sans-serif;
        }
        .chat-input::placeholder { color: #565a75; }
        .chat-send { 
            background: linear-gradient(135deg, #7c5cff, #6a4bff);
            color: #fff; 
            border: none; 
            padding: 9px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            transition: filter 0.15s;
        }
        .chat-send:hover { filter: brightness(1.1); }

        .ping-notification {
            position: fixed;
            bottom: 20px;
            background-color: #3a3739;
        }
    </style>

<style id="manglet-rehost-theme">
:root {
  --manglet-panel: #17191f;
  --manglet-panel-2: #20232b;
  --manglet-border: rgba(255,255,255,.09);
  --manglet-text: #f4f5f7;
  --manglet-muted: #9ba2b2;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
  background: var(--bg-color, #17100c) !important;

  font-family: 'Space Grotesk', Arial, sans-serif !important;

}
.sidebar {
  width: 250px !important; background: var(--sidebar-color, #24160f) !important;
  border-right: 1px solid rgba(255,255,255,.07);
  padding: 22px 12px !important; box-shadow: 8px 0 30px rgba(0,0,0,.12);
  overflow-y: auto; overflow-x: hidden;
}
.sidebar-logo {
  font-family: 'DynaPuff','Space Grotesk',sans-serif !important;
  font-size: 25px !important; letter-spacing: .5px !important;
  color: #fff !important; padding: 0 12px 26px !important;
}
.sidebar-nav { gap: 5px; }
.sidebar-nav a {
  color: #c6cad4 !important; font: 600 13.5px 'Space Grotesk',sans-serif !important;
  padding: 11px 13px !important; border-radius: 12px; margin: 0 2px;
  gap: 11px !important; min-height: 42px; transition: background .18s, color .18s, transform .18s;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: var(--sidebar-hover, #382216) !important; color: #fff !important;
}
.sidebar-nav a.active { box-shadow: inset 3px 0 0 var(--token-accent, #ff8c32); }
.topbar { left: 250px !important; padding: 18px 24px !important; gap: 10px !important; }
.token-display, .ruby-display {
  border: 1px solid rgba(255,255,255,.12); border-radius: 13px !important;
  padding: 8px 13px !important; box-shadow: 0 5px 16px rgba(0,0,0,.16);
  font: 700 13px 'Space Grotesk',sans-serif !important;
}
.token-display { background: var(--token-accent, #ff8c32) !important; color: #fff !important; }
.ruby-display { background: #a92d5b !important; color: #fff !important; }
.main-content { margin-left: 250px !important; padding: 104px 28px 44px !important; min-width: 0; }
.page-title, .owner-title, .profile-name, .section-title, .chat-panel-title, .picker-box h3, .title {
  font-family: 'DynaPuff','Space Grotesk',sans-serif !important;
  color: var(--manglet-text) !important; letter-spacing: -.3px;
}
.page-title { font-size: clamp(25px,3vw,34px) !important; }
.page-subtitle, .owner-subtitle { color: var(--manglet-muted) !important; }
.trade-wrap, .shop-wrap, .profile-wrap, .owner-wrap, .credits-wrap { max-width: 1240px; }
.panel-card, .room-panel, .trade-list-card, .stat-card, .stat-tile, .shop-item-card,
.shop-info-card, .collection-card, .clan-card, .profile-card, .card, .admin-row,
.bazaar-card, .battle-card, .news-card, .leaderboard-card, .chat-panel,
[class*="panel"], [class*="card"] {
  border-color: var(--manglet-border);
}
.room-panel, .trade-list-card, .panel-card, .stat-card, .stat-tile, .shop-item-card,
.shop-info-card, .collection-card, .clan-card, .profile-card, .card, .admin-row,
.bazaar-card, .battle-card, .news-card, .leaderboard-card {
  background: var(--manglet-panel) !important;
  border-radius: var(--manglet-radius) !important;
  box-shadow: var(--manglet-shadow);
}
input, textarea, select, .new-trade-row input, .chat-input-row input, .offer-tokens-row {
  font-family: 'Space Grotesk',sans-serif !important;
  border-radius: 12px !important;
}
input:not([type="checkbox"]):not([type="radio"]), textarea, select {
  background-color: var(--manglet-panel-2) !important;
  color: var(--manglet-text) !important; border-color: var(--manglet-border) !important;
}
button, .button, .btn, .shop-buy-btn, .add-blook-btn, .list-tab-btn, .friends-tab-btn,
.profile-action-btn, .wide-btn {
  font-family: 'Space Grotesk',sans-serif !important; font-weight: 700 !important;
  border-radius: 12px !important; transition: transform .16s, filter .16s, background .16s;
}
button:hover:not(:disabled), .button:hover, .btn:hover { filter: brightness(1.08); }
button:active:not(:disabled) { transform: translateY(1px); }
.list-tab-btn, .friends-tab-btn {

.picker-box { background: var(--manglet-panel) !important; border: 1px solid var(--manglet-border) !important; border-radius: 20px !important; }
.page-header-row { gap: 14px; }
a { transition: color .16s, background .16s; }
@media (max-width: 900px) {

  .sidebar-logo { font-size: 0 !important; padding: 0 0 24px !important; text-align: center; }

  .sidebar-nav a { justify-content: center; padding: 12px 5px !important; gap: 0 !important; font-size: 0 !important; min-height: 44px; }
  .sidebar-nav a .manglet-nav-icon { font-size: 21px !important; }

}
@media (max-width: 560px) {
  .main-content { padding: 84px 12px 24px !important; }

  .token-display, .ruby-display { padding: 6px 8px !important; font-size: 11px !important; }
  .token-display img, .ruby-display img { width: 18px !important; height: 18px !important; }
  .room-panel, .panel-card { padding: 15px !important; }
  .room-footer button { padding: 14px 8px !important; font-size: 12px !important; }
}

<span id="rubyBalance">0</span>
</div>
</div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                GLOBAL CHAT <span class="status-dot"></span> <span class="user-count" id="userCount">1</span>

                <div id="customizePanel" class="customize-panel">
                    
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-footer">
                <form class="chat-form" id="chatForm">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off" required>
                    <button type="submit" class="chat-send">SEND</button>
                </form>
            </div>
        </div>
    </div>

    <div class="ping-notification">
    

    </div>

    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        
        const AUTH_TOKEN = localStorage.getItem('mangletSessionToken');
        if (!AUTH_TOKEN) {
            location.href = "/login";
        }

        async function apiFetch(url, options = {}) {
            const opts = Object.assign({}, options);
            opts.headers = Object.assign(
                { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
                options.headers || {}
            );
            const res = await fetch(url, opts);
            if (res.status === 401) {
                localStorage.removeItem('mangletSessionToken');
                location.href = "/login";
                throw new Error('Not logged in');
            }
            return res;
        }

        const socket = io({ auth: { token: AUTH_TOKEN } }); 
        const form = document.getElementById('chatForm');
        const input = document.getElementById('chatInput');
        const container = document.getElementById('chatMessages');
        const userCountElement = document.getElementById('userCount');
        let me;
        let myUsername;
        let myCollection;
        async function loadMe() {
          const res = await apiFetch('/api/me');
          const data = await res.json();
          me = data.user;
          myUsername = me.username; 
          myCollection = me.collection || {};
          document.getElementById('tokenBalance').innerText = me.tokens;
          const rubyEl = document.getElementById('rubyBalance');
          if (rubyEl) rubyEl.innerText = me.rubies || 0;
          applyMangletTheme(me.theme);
          showOwnerNav(me.isOwner);
          socket.emit('registerUser', myUsername);
        }
        
        loadMe();
        
        const PRESET_SWATCHES = [
            '#ff4d4d', '#ff9f43', '#ffd93d', '#6bcB77',
            '#4d96ff', '#9d4edd', '#ff6bcb', '#00e6c3',
            '#ffffff', '#7b7b7b', '#c0392b', '#1abc9c'
        ];

        function togglePanel() {
            const panel = document.getElementById('customizePanel');
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                panel.classList.remove('open');
                return;
            }
            renderPanel();
            panel.classList.add('open');
        }

        function glowShadow(color) {
            return `text-shadow: 0 0 6px ${color}, 0 0 14px ${color};`;
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('customizePanel');
            const trigger = document.getElementById('customizeTrigger');
            if (panel.classList.contains('open') && !panel.contains(e.target) && !trigger.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
        
            const text = input.value.trim();
            if (!text) return;

            socket.emit('chatMessage', { text });
            input.value = '';
        });

        socket.on('updateUserCount', (count) => {
            userCountElement.innerText = count;
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function appendMessageRow(msg) {
            const row = document.createElement('div');
            row.classList.add('message-row');

            const colors = ['#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#009688', '#4caf50'];
            const colorIndex = msg.user.charCodeAt(0) % colors.length;
            const initial = escapeHtml(msg.user.charAt(0).toUpperCase());
            const safeUser = escapeHtml(msg.user);

            const nameColor = escapeHtml(msg.color || '#e8e8f0'); 
            const nameGlowClass = msg.glow ? 'glow' : '';
            const nameGlowStyle = msg.glow ? glowShadow(nameColor) : '';

            
            
            const avatarInner = msg.avatar
                ? `<img src="${escapeHtml(msg.avatar)}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;" onerror="this.remove(); this.parentElement.innerText='${initial}';">`
                : initial;

            const clanTagHtml = msg.clan
                ? `<span class="clan-tag-chip" data-clanuser="${safeUser}" style="color:${escapeHtml(msg.clan.color)}; border-color:${escapeHtml(msg.clan.color)};">[${escapeHtml(msg.clan.tag)}]</span>`
                : `<span class="clan-tag-chip" data-clanuser="${safeUser}" style="display:none;"></span>`;

            const badgeInnerHtml = (b) => `<img src="${escapeHtml(b.image)}" alt="" class="badge-chip-img" onerror="this.outerHTML='${escapeHtml(b.icon)}';"> ${escapeHtml(b.label)}`;
            const badgeHtml = msg.badge
                ? `<span class="badge-chip" data-badgeuser="${safeUser}">${badgeInnerHtml(msg.badge)}</span>`
                : `<span class="badge-chip" data-badgeuser="${safeUser}" style="display:none;"></span>`;

            row.innerHTML = `
                <div class="avatar" data-user="${safeUser}" data-color="${colors[colorIndex]}" data-initial="${initial}" style="background: ${colors[colorIndex]};">${avatarInner}</div>
                <div class="message-content">
                    <div class="message-meta">
                        ${clanTagHtml}
                        <span class="username ${nameGlowClass}" style="color:${nameColor}; ${nameGlowStyle}">${safeUser}</span>
                        ${badgeHtml}
                    </div>
                    <div class="message-text">${formatMentions(msg.text)}</div>
                </div>
            `;
            container.appendChild(row);
        }

        async function loadChatHistory() {
            try {
                const res = await apiFetch('/api/chat/global');
                const data = await res.json();
                data.messages.forEach(appendMessageRow);
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                
            }
        }

        loadChatHistory();

        socket.on('message', (msg) => {
            appendMessageRow(msg);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('identityUpdate', (payload) => {
            
            
            
            const safeUserSelector = CSS.escape(payload.username); 
            const avatars = container.querySelectorAll(`.avatar[data-user="${safeUserSelector}"]`);
            avatars.forEach(el => {
                if (payload.avatar) {
                    el.innerHTML = `<img src="${escapeHtml(payload.avatar)}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;" onerror="this.remove(); this.parentElement.innerText='${el.dataset.initial}';">`;
                } else {
                    el.innerText = el.dataset.initial;
                }
            });

            const clanChips = container.querySelectorAll(`.clan-tag-chip[data-clanuser="${safeUserSelector}"]`);
            clanChips.forEach(el => {
                if (payload.clan) {
                    el.style.display = '';
                    el.style.color = payload.clan.color;
                    el.style.borderColor = payload.clan.color;
                    el.innerText = `[${payload.clan.tag}]`;
                } else {
                    el.style.display = 'none';
                    el.innerText = '';
                }
            });

            const badgeChips = container.querySelectorAll(`.badge-chip[data-badgeuser="${safeUserSelector}"]`);
            badgeChips.forEach(el => {
                if (payload.badge) {
                    el.style.display = '';
                    el.innerHTML = `<img src="${payload.badge.image}" alt="" class="badge-chip-img" onerror="this.outerHTML='${payload.badge.icon}';"> ${payload.badge.label}`;
                } else {
                    el.style.display = 'none';
                    el.innerText = '';
                }
            });
        });
        function formatMentions(text) {
            return escapeHtml(text).replace(
                /(^|[\s])@([a-zA-Z0-9_]+)/g,
                '$1<span class="mention">@$2</span>'
            );
        }
    </script> 

<script id="manglet-rehost-nav-icons">
(() => {
  const iconMap = {
    'Market':'storefront','Shop':'shopping-bag','Global Chat':'forum','Collection':'inventory_2',
    'Clans':'groups','News':'newspaper','Trade':'swap_horiz','Bazaar':'store',
    'Battle Royale':'sports_esports','Leaderboard':'leaderboard','Ruby Shop':'diamond',
    'Credits':'favorite','Settings':'settings','Profile':'person','Admin Panel':'admin_panel_settings',
    'Owner Panel':'verified_user'
  };
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    const label = a.textContent.trim();
    const icon = iconMap[label];
    if (icon && !a.querySelector('.manglet-nav-icon')) {
      const span = document.createElement('span');
      span.className = 'material-icons manglet-nav-icon';
      span.setAttribute('aria-hidden','true');
      span.textContent = icon;
      span.style.fontSize = '19px';
      span.style.lineHeight = '1';
      a.prepend(span);
    }
  });
})();
</script>

</body>
</html>
